<mat-card>

  <mat-card-header>
    <mat-card-title>
      Connexion
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
   <form (ngSubmit)="login()">

      <mat-form-field appearance="outline">
        <mat-label>Utilisateur</mat-label>
        <input
          matInput
          name="userName"
          autocomplete="userName"
          [(ngModel)]="userName">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Mot de passe</mat-label>
        <input
          matInput
          type="password"
          name="password"
          autocomplete="current-password"
          [(ngModel)]="password">
      </mat-form-field>

     <button
       mat-flat-button
       color="primary"
       type="submit">
       Se connecter
     </button>


   </form>
  </mat-card-content>
</mat-card>
