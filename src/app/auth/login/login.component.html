<h2>Connexion</h2>

<form (ngSubmit)="login()">

  <div>
    <label>Utilisateur</label>
    <input
      type="text"
      name="username"
      [(ngModel)]="username">
  </div>

  <div>
    <label>Mot de passe</label>
    <input
      type="password"
      name="password"
      [(ngModel)]="password">
  </div>

  <button type="submit">
    Se connecter
  </button>

</form>
