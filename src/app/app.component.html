@if (authService.isAuthenticated()) {

<mat-toolbar color="primary">

  <span>Event Project</span>


  <span class="spacer"></span>

  <a mat-button
     routerLink="/accueil"
     routerLinkActive="active-link"
     [routerLinkActiveOptions]="{ exact: true }">
    Accueil
  </a>

  <a mat-button
     routerLink="/orders"
     routerLinkActive="active-link">
    Liste
  </a>

  <a mat-button
     routerLink="/search"
     routerLinkActive="active-link">
    Recherche
  </a>
  <a mat-button
     routerLink="/users"
     routerLinkActive="active-link">Users</a>
  <a mat-button
     routerLink="/roles"
     routerLinkActive="active-link">Roles</a>

  <span>{{ authService.getUserName() }}</span>
  &nbsp;
  <button
    mat-flat-button
    color="primary" (click)="logout()">
    Déconnexion
  </button>

</mat-toolbar>

}

<router-outlet></router-outlet>
