<h2>Création d'une commande</h2>

<mat-form-field appearance="outline">
  <mat-label>Client</mat-label>
  <input
    matInput
    [(ngModel)]="customer">
</mat-form-field>

<p>Client saisi : {{ customer }}</p>

<button
  mat-raised-button
  color="primary"
  (click)="save()">
  Enregistrer
</button>
